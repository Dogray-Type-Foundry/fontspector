# Removed in triage:
#   alt_caron
#   cjk_chws_feature
#   cjk_not_enough_glyphs
#   contour_count
#   file_size
#   hinting_impact
#   ligature_carets
#   name/no_copyright_on_description
#   smart_dropout
#   soft_hyphen
#   STAT_in_statics
#   field_values
#   has_glyphs
#   has_unicodes
#   opentype/vendor_id
# Replaced by Dogray checks:
#   family/win_ascent_and_descent -> dogray/vertical_metrics
#   linegaps -> dogray/vertical_metrics
#   os2_metrics_match_hhea -> dogray/vertical_metrics
#   typoascender_exceeds_Agrave -> dogray/vertical_metrics
#   no_mac_entries -> dogray/mac_names
#   rupee -> dogray/currency_symbols
#   opentype/family/consistent_family_name -> dogray/consistent_family_name
#   name/family_and_style_max_length -> dogray/family_and_style_max_length
#   typographic_family_name -> dogray/consistent_family_name (same comparison)
#   family/vertical_metrics -> dogray/vertical_metrics (its "Same values in every font" row)
#   opentype/code_pages -> dogray/os2_ranges_match_cmap
# Ported from the Google Fonts profile with neutral wording:
#   googlefonts/fstype -> dogray/fstype (WARN)
#   googlefonts/metadata/valid_nameid25 -> dogray/valid_nameid25
#   googlefonts/family/equal_codepoint_coverage -> dogray/equal_codepoint_coverage

# Severity changes
[[overrides."math_signs_width"]]
code = "width-outliers"
status = "INFO"
reason = "Dogray: informational only"
[[overrides."dsig"]]
code = "found-DSIG"
status = "INFO"
reason = "Dogray: only inform when a DSIG table is present"
[[overrides."varfont/unsupported_axes"]]
code = "unsupported-ital"
status = "INFO"
reason = "Dogray: informational only"

# Outline checks: WARN only where the problem shows (kinks, overlapping
# segments, wrong direction); heuristics for things that aren't objectively
# wrong are INFO.
[[overrides."outline_alignment_miss"]]
code = "found-misalignments"
status = "INFO"
reason = "Dogray: near-miss alignments are often intentional"
[[overrides."outline_alignment_miss"]]
code = "skip-cap-x-height-alignment"
status = "INFO"
reason = "Dogray: informational only"
[[overrides."outline_colinear_vectors"]]
code = "found-colinear-vectors"
status = "INFO"
reason = "Dogray: a redundant point doesn't change the outline"
[[overrides."outline_semi_vertical"]]
code = "found-semi-vertical"
status = "INFO"
reason = "Dogray: nearly vertical/horizontal lines are often by design"
[[overrides."outline_short_segments"]]
code = "found-short-segments"
status = "INFO"
reason = "Dogray: short segments are often by design"

# Relaxed to WARN, as in the Adobe Fonts profile
[[overrides."whitespace_glyphs"]]
code = "missing-whitespace-glyph-0x00A0"
status = "WARN"
reason = "Dogray: relaxed to a warning, as Adobe Fonts does"
[[overrides."valid_glyphnames"]]
code = "found-invalid-names"
status = "WARN"
reason = "Dogray: relaxed to a warning, as Adobe Fonts does"
[[overrides."opentype/name/match_familyname_fullfont"]]
code = "mismatch-font-names"
status = "WARN"
reason = "Dogray: relaxed to a warning, as Adobe Fonts does"
[[overrides."opentype/fvar/regular_coords_correct"]]
code = "no-regular-instance"
status = "WARN"
reason = "Dogray: relaxed to a warning, as Adobe Fonts does"
[[overrides."opentype/varfont/valid_default_instance_nameids"]]
code = "invalid-default-instance-subfamily-name"
status = "WARN"
reason = "Dogray: relaxed to a warning, as Adobe Fonts does"
[[overrides."opentype/varfont/valid_default_instance_nameids"]]
code = "invalid-default-instance-postscript-name"
status = "WARN"
reason = "Dogray: relaxed to a warning, as Adobe Fonts does"
[[overrides."opentype/weight_class_fvar"]]
code = "bad-weight-class"
status = "WARN"
reason = "Dogray: relaxed to a warning, as Adobe Fonts does"

# Name IDs every font must have (from TTF's name/windows_records and name/designer_name)
[configuration_defaults."universal/required_name_ids"]
required_name_ids = [1, 2, 3, 4, 5, 6, 9]

# Dogray never adds STAT tables to static fonts
[configuration_defaults."opentype/STAT/ital_axis"]
IGNORE_STATIC_FONTS = true

# Combining marks used in GPOS mark attachment count as reachable
[configuration_defaults.unreachable_glyphs]
MARK_ATTACHMENT_IS_REACHABLE = true
